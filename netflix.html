<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix</title>
    <link rel="stylesheet" href="css/netflix.css">
    <script src="https://kit.fontawesome.com/393376cf44.js" crossorigin="anonymous"></script>
</head>

<body>

    <!-- HEADER -->
    <header>
        <div id="header-top">
            <img src="images/logo.png" alt="Netflix logo">
            <a class="button" href="#">Sign In</a>
        </div>
        <div id="header-content">
            <h1>See what's next</h1>
            <p>Watch anywhere. Cancel anytime.</p>
            <a class="button" href="#">Watch Free For 30 Days</a>
        </div>
    </header>

    <!-- TABS -->
    <section id="tabs">
        <div>
            <i class="fa-solid fa-door-open fa-3x"></i>
            <p>Cancel any time</p>
        </div>
        <div>

        </div>
        <div>

        </div>
    </section>

</body>

</html>
